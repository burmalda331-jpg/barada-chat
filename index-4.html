<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>барада.чат</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#5b8af0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="барада"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#0d0f14;--bg1:#13161e;--bg2:#1a1e29;--bg3:#222840;
  --accent:#5b8af0;--accent2:#a78bfa;--green:#34d399;--red:#f87171;
  --text:#e8eaf6;--text2:#8892b0;--text3:#4a5578;--border:#1e2235;
  --font:'Nunito',system-ui,sans-serif;
}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg0);color:var(--text);font-family:var(--font)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}
#auth{display:flex;align-items:center;justify-content:center;height:100%;height:100dvh;background:radial-gradient(ellipse at 30% 20%,#1a2040,var(--bg0) 60%)}
.auth-card{width:360px;background:var(--bg1);border:1px solid var(--border);border-radius:24px;padding:36px;box-shadow:0 8px 48px rgba(0,0,0,.6);animation:slideUp .4s cubic-bezier(.16,1,.3,1)}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{font-size:52px;display:block;margin-bottom:8px}
.logo h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{color:var(--text2);font-size:13px;margin-top:4px}
.tabs{display:flex;background:var(--bg2);border-radius:10px;padding:3px;margin-bottom:20px}
.tab{flex:1;padding:8px;border:none;background:transparent;color:var(--text2);font-family:var(--font);font-size:14px;font-weight:700;border-radius:8px;cursor:pointer;transition:.2s}
.tab.on{background:var(--accent);color:#fff}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--text2);margin-bottom:5px;letter-spacing:.5px;text-transform:uppercase}
.field input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:var(--font);font-size:14px;outline:none;transition:.2s}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--text3)}
.av-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.av-opt{width:40px;height:40px;border-radius:10px;background:var(--bg2);border:2px solid transparent;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.av-opt:hover,.av-opt.on{border-color:var(--accent);background:rgba(91,138,240,.15);transform:scale(1.08)}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;color:#fff;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4;cursor:not-allowed}
.err{background:rgba(248,113,113,.1);border:1px solid var(--red);color:var(--red);border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:14px;display:none}
#app{display:flex;height:100%;height:100dvh;overflow:hidden}
.sidebar{width:290px;min-width:290px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:.3s}
.s-head{padding:14px;border-bottom:1px solid var(--border)}
.me-row{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.me-av{width:40px;height:40px;border-radius:12px;background:var(--bg3);font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;flex-shrink:0;overflow:hidden}
.me-av img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.me-av:hover{transform:scale(1.08)}
.me-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-un{font-size:11px;color:var(--text2);font-family:monospace}
.btn-ic{background:var(--bg2);border:1px solid var(--border);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:16px;transition:.15s;flex-shrink:0}
.btn-ic:hover{background:var(--bg3);color:var(--text)}
.s-search{position:relative}
.s-search input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px 8px 32px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:.2s}
.s-search input:focus{border-color:var(--accent)}
.s-search::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px}
.s-tabs{display:flex;gap:2px;padding:8px 14px 0}
.s-tab{flex:1;padding:6px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--text2);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:.2s}
.s-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.chat-list{flex:1;overflow-y:auto;padding:6px}
.ci{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;cursor:pointer;transition:.15s}
.ci:hover{background:var(--bg2)}.ci.on{background:rgba(91,138,240,.12)}
.ci-av{width:44px;height:44px;border-radius:13px;background:var(--bg3);font-size:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ci-av img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.ci-info{flex:1;min-width:0}
.ci-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-prev{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ci-time{font-size:10px;color:var(--text3);flex-shrink:0}
.s-foot{padding:10px;border-top:1px solid var(--border);display:flex;gap:7px}
.btn-new{flex:1;padding:10px;background:rgba(91,138,240,.1);border:1px dashed rgba(91,138,240,.3);border-radius:11px;color:var(--accent);font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.btn-new:hover{background:rgba(91,138,240,.2)}
.empty-list{text-align:center;color:var(--text3);font-size:12px;padding:28px 12px;line-height:1.6}
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.c-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;background:var(--bg1)}
.c-head-av{width:40px;height:40px;border-radius:12px;background:var(--bg3);font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.c-head-av img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.c-head-name{font-weight:700;font-size:16px}
.c-head-sub{font-size:12px;color:var(--text2);margin-top:1px}
.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:4px}
.c-head-acts{margin-left:auto;display:flex;gap:6px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.day-div{text-align:center;margin:10px 0}
.day-div span{background:var(--bg2);color:var(--text2);font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px}
.msg-row{display:flex;align-items:flex-end;gap:7px}
.msg-row.own{flex-direction:row-reverse}
.msg-sav{width:28px;height:28px;border-radius:8px;background:var(--bg3);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.msg-sav img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.bubble{max-width:62%;padding:9px 13px;border-radius:16px;animation:msgIn .18s ease;word-break:break-word}
.msg-row:not(.own) .bubble{background:var(--bg2);border-bottom-left-radius:4px}
.msg-row.own .bubble{background:linear-gradient(135deg,var(--accent),#4a76e0);color:#fff;border-bottom-right-radius:4px}
.msg-sname{font-size:11px;font-weight:700;color:var(--accent2);margin-bottom:3px}
.msg-text{font-size:14px;line-height:1.5}
.msg-time{font-size:10px;color:rgba(255,255,255,.45);margin-top:3px;text-align:right}
.msg-row:not(.own) .msg-time{color:var(--text3)}
.input-bar{padding:10px 18px 14px;border-top:1px solid var(--border);background:var(--bg1);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.input-bar-row{display:flex;align-items:flex-end;gap:9px}
.input-bar textarea{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:11px 14px;color:var(--text);font-family:var(--font);font-size:14px;resize:none;outline:none;max-height:120px;line-height:1.5;transition:.2s}
.input-bar textarea:focus{border-color:var(--accent)}
.input-bar textarea::placeholder{color:var(--text3)}
.send-btn{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.send-btn:hover{transform:scale(1.06)}.send-btn:active{transform:scale(.94)}.send-btn:disabled{opacity:.35;cursor:not-allowed}

/* ── REPLY BAR ── */
.reply-bar{display:none;align-items:center;gap:8px;background:var(--bg2);border-radius:10px;padding:7px 11px;font-size:12px;border-left:3px solid var(--accent)}
.reply-bar.active{display:flex}
.reply-bar-text{flex:1;min-width:0;color:var(--text2)}
.reply-bar-name{font-weight:700;color:var(--accent);margin-right:5px}
.reply-bar-msg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-bar-close{cursor:pointer;color:var(--text3);font-size:16px;flex-shrink:0}

/* ── TYPING INDICATOR ── */
.typing-bar{padding:2px 18px 4px;font-size:11px;color:var(--text2);min-height:18px;flex-shrink:0}
.typing-dots{display:inline-flex;gap:3px;margin-left:4px;vertical-align:middle}
.typing-dots span{width:5px;height:5px;background:var(--text2);border-radius:50%;animation:typingBounce 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ── REACTIONS ── */
.msg-reactions{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.reaction-chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:2px 8px;font-size:12px;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:3px;user-select:none}
.reaction-chip:hover{border-color:var(--accent)}
.reaction-chip.mine{background:rgba(91,138,240,.15);border-color:var(--accent)}
.reaction-count{font-size:11px;color:var(--text2)}
.emoji-picker{position:absolute;bottom:100%;background:var(--bg1);border:1px solid var(--border);border-radius:14px;padding:8px;display:flex;gap:5px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:50;animation:fadeIn .15s}
.emoji-picker span{font-size:20px;cursor:pointer;padding:4px;border-radius:8px;transition:.1s}
.emoji-picker span:hover{background:var(--bg3);transform:scale(1.2)}

/* ── MESSAGE CONTEXT MENU ── */
.msg-menu{position:absolute;background:var(--bg1);border:1px solid var(--border);border-radius:13px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:60;min-width:160px;overflow:hidden;animation:fadeIn .12s}
.msg-menu-item{padding:10px 15px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.1s}
.msg-menu-item:hover{background:var(--bg2)}
.msg-menu-item.danger{color:var(--red)}

/* ── REPLY PREVIEW IN BUBBLE ── */
.reply-preview{background:rgba(255,255,255,.06);border-left:3px solid var(--accent2);border-radius:7px;padding:5px 9px;margin-bottom:5px;font-size:12px}
.reply-preview-name{font-weight:700;color:var(--accent2);margin-bottom:2px}
.reply-preview-text{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── EDIT MODE ── */
.edit-bar{display:none;align-items:center;gap:8px;background:rgba(91,138,240,.08);border-radius:10px;padding:7px 11px;font-size:12px;border-left:3px solid var(--accent2)}
.edit-bar.active{display:flex}
.edit-bar-text{flex:1;color:var(--text2)}
.edit-bar-close{cursor:pointer;color:var(--text3);font-size:16px;flex-shrink:0}

/* ── ONLINE STATUS DOT IN CHAT LIST ── */
.ci-av-wrap{position:relative;flex-shrink:0}
.online-dot{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;background:var(--green);border-radius:50%;border:2px solid var(--bg1)}

/* ── EDITED LABEL ── */
.msg-edited{font-size:9px;color:rgba(255,255,255,.3);margin-left:4px}
.msg-row:not(.own) .msg-edited{color:var(--text3)}
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text2)}
.empty-chat .big{font-size:72px;opacity:.25}
.empty-chat h2{font-size:22px;color:var(--text);font-weight:800}
.empty-chat p{font-size:13px;text-align:center;max-width:260px;line-height:1.7}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s}
.modal{background:var(--bg1);border:1px solid var(--border);border-radius:20px;padding:26px;width:400px;max-width:95vw;box-shadow:0 12px 60px rgba(0,0,0,.7);animation:slideUp .3s cubic-bezier(.16,1,.3,1);max-height:90vh;overflow-y:auto}
.modal h2{font-size:19px;font-weight:800;margin-bottom:18px}
.m-foot{display:flex;gap:9px;margin-top:18px}
.btn-cancel{flex:1;padding:11px;background:var(--bg2);border:1px solid var(--border);border-radius:11px;color:var(--text2);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn-cancel:hover{background:var(--bg3)}
.ulist{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto;margin-top:7px}
.ui{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;cursor:pointer;transition:.15s}
.ui:hover{background:var(--bg2)}.ui.on{background:rgba(91,138,240,.13)}
.ui-av{width:36px;height:36px;border-radius:10px;background:var(--bg3);font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.ui-av img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.ui-name{font-weight:700;font-size:14px}.ui-un{font-size:11px;color:var(--text2);font-family:monospace}
.check{margin-left:auto;color:var(--accent);font-size:16px}
.notif{position:fixed;top:16px;right:16px;background:var(--bg1);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:12px 16px;z-index:200;animation:slideLeft .3s cubic-bezier(.16,1,.3,1);max-width:280px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.notif-title{font-weight:700;font-size:13px;margin-bottom:3px}
.notif-text{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes msgIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:680px){
  .sidebar{position:fixed;inset:0;z-index:50;width:100%;transform:translateX(-100%)}
  .sidebar.mob-open{transform:translateX(0)}
  .mob-back{display:flex!important}
  .chat-area{width:100%}
}
.mob-back{display:none}

.attach-btn{width:44px;height:44px;border-radius:13px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.attach-btn:hover{background:var(--bg3);color:var(--text)}
.rec-btn{width:44px;height:44px;border-radius:13px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.rec-btn.recording{background:var(--red);border-color:var(--red);color:#fff;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.5}}
.msg-img{width:220px;max-width:220px;height:auto;border-radius:10px;cursor:pointer;display:block}
.msg-audio{width:180px;margin-top:4px}
audio{accent-color:var(--accent)}

.chat-loading{position:absolute;inset:0;background:var(--bg1);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;z-index:10;border-radius:0}
.chat-loading .spinner{width:36px;height:36px;border:3px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.chat-loading .load-name{font-size:15px;font-weight:700;color:var(--text)}
.chat-loading .load-sub{font-size:12px;color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <div class="logo">
      <span class="logo-icon">💬</span>
      <h1>барада.чат</h1>
      <p>Свой мессенджер. Для своих.</p>
    </div>
    <div class="tabs">
      <button class="tab on" onclick="setMode('login')">Вход</button>
      <button class="tab" onclick="setMode('reg')">Регистрация</button>
    </div>
    <div class="err" id="auth-err"></div>
    <div id="reg-fields" style="display:none">
      <div class="field"><label>Имя</label><input id="f-name" placeholder="Твоё имя"/></div>
    </div>
    <div class="field"><label>Логин</label><input id="f-user" placeholder="username" autocomplete="username"/></div>
    <div class="field"><label>Пароль</label><input id="f-pass" type="password" placeholder="••••••" autocomplete="current-password"/></div>
    <div id="av-field" style="display:none">
      <div class="field"><label>Аватар</label><div class="av-grid" id="av-grid"></div></div>
    </div>
    <button class="btn" id="auth-btn" onclick="submitAuth()">Войти</button>
  </div>
</div>

<div id="app" style="display:none">
  <div class="sidebar" id="sidebar">
    <div class="s-head">
      <div class="me-row">
        <div class="me-av" id="me-av" onclick="openEditProfile()"></div>
        <div style="min-width:0;flex:1">
          <div class="me-name" id="me-name"></div>
          <div class="me-un" id="me-un"></div>
        </div>
        <div class="btn-ic" onclick="logout()" title="Выйти">⏻</div>
      </div>
      <div class="s-search"><input id="s-search" placeholder="Поиск..." oninput="renderChats()"/></div>
      <div class="s-tabs">
        <button class="s-tab on" onclick="setTab('all',this)">Все</button>
        <button class="s-tab" onclick="setTab('dm',this)">Личные</button>
        <button class="s-tab" onclick="setTab('groups',this)">Группы</button>
      </div>
    </div>
    <div class="chat-list" id="chat-list"></div>
    <div class="s-foot">
      <button class="btn-new" onclick="openNewDM()">💬 Чат</button>
      <button class="btn-new" onclick="openNewGroup()">👥 Группа</button>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-loading" id="chat-loading" style="display:none">
      <div class="spinner"></div>
      <div class="load-name" id="load-name"></div>
      <div class="load-sub">Загружаем сообщения...</div>
    </div>
    <div class="empty-chat" id="empty-chat">
      <div class="big">💬</div>
      <h2>барада.чат</h2>
      <p>Выбери чат слева или начни новый разговор.</p>
      <button class="btn" style="width:auto;padding:11px 24px;margin-top:6px" onclick="openNewDM()">Начать чат</button>
    </div>
    <div id="chat-view" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="c-head">
        <button class="btn-ic mob-back" onclick="closeMobileChat()">←</button>
        <div class="c-head-av" id="c-head-av"></div>
        <div>
          <div class="c-head-name" id="c-head-name"></div>
          <div class="c-head-sub" id="c-head-sub"></div>

<script>

const SUPABASE_URL      = 'https://bhmfdzmtviuatsxwjxap.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJobWZkem10dml1YXRzeHdqeGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTAyMjMsImV4cCI6MjA5NjE2NjIyM30.dDTcKX1ryRP0ZVgTaNDYyPqUg71KjXtgjh9wfPH3YNc';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const AVATARS   = ['🐺','🦊','🐻','🦁','🐯','🦝','🦄','🐲','🦅','🐬','🌟','⚡','🔥','🌙','💎'];
const GROUP_AVS = ['👥','🎮','📚','💼','🎵','🏋️','🍕','✈️','🔥','⚡','🌟','🎉'];

let me=null, chats=[], activeChat=null, msgs=[], allUsers=[], tab='all', realtimeSub=null;
let replyTo=null, editingMsgId=null, typingTimer=null, onlineUsers=new Set(), reactions={};

// ── AUTH ─────────────────────────────────────────────
let authMode='login', selAvatar=AVATARS[0];

function setMode(m){
  authMode=m;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('on',(i===0&&m==='login')||(i===1&&m==='reg')));
  document.getElementById('reg-fields').style.display=m==='reg'?'block':'none';
  document.getElementById('av-field').style.display=m==='reg'?'block':'none';

}
function buildAvGrid(){
  document.getElementById('av-grid').innerHTML=AVATARS.map(a=>
    `<div class="av-opt${a===selAvatar?' on':''}" onclick="pickAv('${a}')">${a}</div>`).join('');
}
buildAvGrid();
function pickAv(a){selAvatar=a;buildAvGrid();}
function showErr(t){const e=document.getElementById('auth-err');e.textContent=t;e.style.display='block';}
function hideErr(){document.getElementById('auth-err').style.display='none';}
document.getElementById('f-pass').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();});

async function submitAuth(){
  hideErr();
  const btn=document.getElementById('auth-btn');
  btn.disabled=true;
  try{
    const username=document.getElementById('f-user').value.trim().toLowerCase();
    const password=document.getElementById('f-pass').value;
    if(!username||!password) throw new Error('Заполните все поля');
    const email=`${username}@gmail.com`;

    if(authMode==='reg'){
      const name=document.getElementById('f-name').value.trim();
      if(!name) throw new Error('Введи имя');
      if(username.length<3) throw new Error('Логин минимум 3 символа');
      if(password.length<4) throw new Error('Пароль минимум 4 символа');
      const {data:ex}=await sb.from('profiles').select('id').eq('username',username).maybeSingle();
      if(ex) throw new Error('Логин уже занят');
      const {data,error}=await sb.auth.signUp({email,password});
      if(error) throw new Error(error.message);
      const {error:pe}=await sb.from('profiles').insert({id:data.user.id,username,name,avatar:selAvatar});
      if(pe) throw new Error(pe.message);
      me={id:data.user.id,username,name,avatar:selAvatar,avatar_url:null};
    } else {
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw new Error('Неверный логин или пароль');
      const {data:profile,error:pe}=await sb.from('profiles').select('*').eq('id',data.user.id).single();
      if(pe) throw new Error(pe.message);
      me=profile;
    }
    localStorage.setItem('bc_me',JSON.stringify(me));
    startApp();
  } catch(e){showErr(e.message);}
  finally{btn.disabled=false;}
}

// ── APP ───────────────────────────────────────────────
async function startApp(){
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='flex';
  renderMe();
  await loadAll();
  connectRealtime();
}
function renderMe(){
  document.getElementById('me-name').textContent=me.name;
  document.getElementById('me-un').textContent='@'+me.username;
  document.getElementById('me-av').innerHTML=me.avatar_url?`<img src="${me.avatar_url}"/>`:me.avatar;
}
async function logout(){
  await sb.auth.signOut();
  if(realtimeSub) sb.removeChannel(realtimeSub);
  me=null;chats=[];msgs=[];activeChat=null;
  localStorage.removeItem('bc_me');
  document.getElementById('app').style.display='none';
  document.getElementById('auth').style.display='flex';
}

// ── DATA ──────────────────────────────────────────────
async function loadAll(){
  const [chatRes,userRes]=await Promise.all([loadChats(),
    sb.from('profiles').select('id,username,name,avatar,avatar_url').neq('id',me.id)]);
  chats=chatRes;
  allUsers=userRes.data||[];
  renderChats();
}

async function loadChats(){
  const {data:memberRows}=await sb.from('chat_members').select('chat_id').eq('user_id',me.id);
  if(!memberRows?.length) return [];
  const chatIds=memberRows.map(r=>r.chat_id);
  const {data:chatRows}=await sb.from('chats').select('*').in('id',chatIds);
  if(!chatRows?.length) return [];
  const {data:lastMsgs}=await sb.from('messages').select('chat_id,text,created_at,sender_id')
    .in('chat_id',chatIds).order('created_at',{ascending:false});
  const {data:memberData}=await sb.from('chat_members')
    .select('chat_id, profiles(id,username,name,avatar,avatar_url)').in('chat_id',chatIds);
  const lastMap={};
  for(const m of lastMsgs||[]) if(!lastMap[m.chat_id]) lastMap[m.chat_id]=m;
  const membMap={};
  for(const r of memberData||[]){if(!membMap[r.chat_id]) membMap[r.chat_id]=[];if(r.profiles) membMap[r.chat_id].push(r.profiles);}
  return chatRows.map(c=>({
    ...c,
    last_text:lastMap[c.id]?.text||null,
    last_at:lastMap[c.id]?.created_at?+new Date(lastMap[c.id].created_at):null,
    last_sender:lastMap[c.id]?.sender_id||null,
    members:membMap[c.id]||[]
  })).sort((a,b)=>(b.last_at||+new Date(b.created_at))-(a.last_at||+new Date(a.created_at)));
}

// ── REALTIME ──────────────────────────────────────────
function connectRealtime(){
  if(realtimeSub) sb.removeChannel(realtimeSub);

  // Presence channel for online status
  const presenceCh = sb.channel('online:global', {config:{presence:{key:me.id}}});
  presenceCh.on('presence',{event:'sync'},()=>{
    const state = presenceCh.presenceState();
    onlineUsers = new Set(Object.keys(state));
    renderChats();
    if(activeChat) updateHeadSub();
  }).subscribe(async status=>{
    if(status==='SUBSCRIBED') await presenceCh.track({user_id:me.id,online_at:new Date().toISOString()});
  });

  realtimeSub=sb.channel('barada')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async payload=>{
      const m=payload.new;
      const chat=chats.find(c=>c.id===m.chat_id);
      if(!chat){await loadAll();return;}
      const sender=allUsers.find(u=>u.id===m.sender_id)||(me.id===m.sender_id?me:null);
      const enriched={id:m.id,chat_id:m.chat_id,text:m.text,created_at:+new Date(m.created_at),
        reply_to:m.reply_to||null,edited:m.edited||false,
        sender_id:m.sender_id,sender_name:sender?.name||'?',sender_avatar:sender?.avatar||'👤',
        sender_avatar_url:sender?.avatar_url||null,sender_username:sender?.username||''};
      if(activeChat?.id===m.chat_id&&!msgs.find(x=>x.id===m.id)){
        msgs.push(enriched);renderMsgs();scrollBottom();
      }
      const idx=chats.findIndex(c=>c.id===m.chat_id);
      if(idx>=0){
        chats[idx].last_text=m.text;chats[idx].last_at=+new Date(m.created_at);chats[idx].last_sender=m.sender_id;
        chats.sort((a,b)=>(b.last_at||+new Date(b.created_at))-(a.last_at||+new Date(a.created_at)));
        renderChats();
      }
      const previewText=m.text.startsWith('[img]')?'📷 Фото':m.text.startsWith('[audio]')?'🎤 Голосовое':m.text;
      if(!activeChat||activeChat.id!==m.chat_id) showNotif(getChatDisplay(chat).name,previewText);
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages'},payload=>{
      const m=payload.new;
      const idx=msgs.findIndex(x=>x.id===m.id);
      if(idx>=0){msgs[idx].text=m.text;msgs[idx].edited=true;renderMsgs();}
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},payload=>{
      const id=payload.old.id;
      msgs=msgs.filter(x=>x.id!==id);
      renderMsgs();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_members'},async payload=>{
      if(payload.new.user_id===me.id) await loadAll();
    })
    .on('broadcast',{event:'typing'},payload=>{
      if(!activeChat||payload.payload.chat_id!==activeChat.id||payload.payload.user_id===me.id) return;
      showTyping(payload.payload.name);
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'reactions'},payload=>{
      const r=payload.new;
      if(!reactions[r.message_id]) reactions[r.message_id]=[];
      if(!reactions[r.message_id].find(x=>x.user_id===r.user_id&&x.emoji===r.emoji)){
        reactions[r.message_id].push(r);
        if(activeChat && msgs.find(m=>m.id===r.message_id)) renderMsgs();
      }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'reactions'},payload=>{
      const r=payload.old;
      if(reactions[r.message_id]) reactions[r.message_id]=reactions[r.message_id].filter(x=>!(x.user_id===r.user_id&&x.emoji===r.emoji));
      if(activeChat && msgs.find(m=>m.id===r.message_id)) renderMsgs();
    })
    .subscribe();
}

// ── TYPING ────────────────────────────────────────────
let typingHideTimer=null;
function showTyping(name){
  const bar=document.getElementById('typing-bar');
  if(!bar) return;
  bar.innerHTML=`${name} печатает<span class="typing-dots"><span></span><span></span><span></span></span>`;
  if(typingHideTimer) clearTimeout(typingHideTimer);
  typingHideTimer=setTimeout(()=>{if(bar)bar.innerHTML='';},3000);
}
async function notifyTyping(){
  if(!activeChat||!realtimeSub) return;
  if(typingTimer) return;
  typingTimer=setTimeout(()=>{typingTimer=null;},2000);
  await sb.channel('barada').send({type:'broadcast',event:'typing',payload:{chat_id:activeChat.id,user_id:me.id,name:me.name}});
}

// ── ONLINE STATUS ─────────────────────────────────────
function isOnline(userId){return onlineUsers.has(userId);}
function updateHeadSub(){
  const el=document.getElementById('c-head-sub');if(!el||!activeChat) return;
  if(activeChat.type==='group'){el.textContent=`${activeChat.members?.length||0} участников`;return;}
  const other=activeChat.members?.find(m=>m.id!==me.id);
  if(other&&isOnline(other.id)) el.innerHTML='<span class="dot"></span>В сети';
  else el.innerHTML='<span style="display:inline-block;width:7px;height:7px;background:var(--text3);border-radius:50%;margin-right:4px"></span>Не в сети';
}

// ── CHATS LIST ────────────────────────────────────────
function setTab(t,el){
  tab=t;
  document.querySelectorAll('.s-tab').forEach(s=>s.classList.remove('on'));
  el?.classList.add('on');renderChats();
}
function getChatDisplay(chat){
  if(chat.type==='dm'){const other=chat.members?.find(m=>m.id!==me.id);
    if(other) return{name:other.name,av:other.avatar_url?`<img src="${other.avatar_url}"/>`:other.avatar};}
  return{name:chat.name||'Группа',av:chat.avatar||'👥'};
}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}
function renderChats(){
  const q=document.getElementById('s-search').value.toLowerCase();
  const list=document.getElementById('chat-list');
  const fil=chats.filter(c=>{
    const d=getChatDisplay(c);
    if(!d.name.toLowerCase().includes(q)) return false;
    if(tab==='dm') return c.type==='dm';
    if(tab==='groups') return c.type==='group';
    return true;
  });
  if(!fil.length){list.innerHTML=`<div class="empty-list">Нет чатов.<br>Начни новый разговор!</div>`;return;}
  list.innerHTML=fil.map(c=>{
    const d=getChatDisplay(c);
    const preview=c.last_text?(c.last_sender===me.id?'Вы: ':'')+c.last_text:'Нет сообщений';
    const otherMember = c.type==='dm' ? c.members?.find(m=>m.id!==me.id) : null;
    const showOnline = otherMember && isOnline(otherMember.id);
    return `<div class="ci${activeChat?.id===c.id?' on':''}" onclick="openChat('${c.id}')">
      <div class="ci-av-wrap">
        <div class="ci-av">${avHtml(d.av)}</div>
        ${showOnline?'<div class="online-dot"></div>':''}
      </div>
      <div class="ci-info"><div class="ci-name">${esc(d.name)}</div><div class="ci-prev">${esc(preview.slice(0,60))}</div></div>
      ${c.last_at?`<div class="ci-time">${fmtTime(c.last_at)}</div>`:''}
    </div>`;
  }).join('');
}

// ── OPEN CHAT ─────────────────────────────────────────
async function openChat(id){
  activeChat=chats.find(c=>c.id===id);if(!activeChat) return;
  msgs=[];
  document.getElementById('sidebar').classList.remove('mob-open');
  document.getElementById('empty-chat').style.display='none';

  // Показываем экран загрузки
  const loader=document.getElementById('chat-loading');
  const d=getChatDisplay(activeChat);
  document.getElementById('load-name').textContent=d.name;
  loader.style.display='flex';

  // Показываем chat-view но скрываем содержимое
  const cv=document.getElementById('chat-view');cv.style.display='flex';cv.style.flexDirection='column';
  document.getElementById('msgs').style.visibility='hidden';
  document.getElementById('msg-input').disabled=true;
  document.getElementById('send-btn').disabled=true;

  document.getElementById('c-head-av').innerHTML=avHtml(d.av);
  document.getElementById('c-head-name').textContent=d.name;
  updateHeadSub();
  document.getElementById('c-head-acts').innerHTML=activeChat.type==='group'
    ?`<div class="btn-ic" onclick="openGroupInfo()">👥</div>`:'';
  renderChats();

  // Грузим сообщения + минимум 1.5 сек
  await Promise.all([loadMsgs(), new Promise(r=>setTimeout(r,1500))]);

  // Скрываем загрузку
  loader.style.display='none';
  document.getElementById('msgs').style.visibility='visible';
  document.getElementById('msg-input').disabled=false;
  document.getElementById('send-btn').disabled=false;
  scrollBottom();
}
async function loadMsgs(){
  const {data}=await sb.from('messages')
    .select('id,chat_id,text,created_at,sender_id,reply_to,edited,profiles!sender_id(name,avatar,avatar_url,username)')
    .eq('chat_id',activeChat.id).order('created_at',{ascending:false}).limit(60);
  msgs=(data||[]).reverse().map(m=>({
    id:m.id,chat_id:m.chat_id,text:m.text,created_at:+new Date(m.created_at),sender_id:m.sender_id,
    reply_to:m.reply_to||null,edited:m.edited||false,
    sender_name:m.profiles?.name||'?',sender_avatar:m.profiles?.avatar||'👤',
    sender_avatar_url:m.profiles?.avatar_url||null,sender_username:m.profiles?.username||''
  }));

  // Load reactions for these messages
  const msgIds=msgs.map(m=>m.id);
  if(msgIds.length){
    const {data:reacts}=await sb.from('reactions').select('*').in('message_id',msgIds);
    reactions={};
    for(const r of reacts||[]){
      if(!reactions[r.message_id]) reactions[r.message_id]=[];
      reactions[r.message_id].push(r);
    }
  }

  renderMsgs();scrollBottom();
}
function renderMsgs(){
  const container=document.getElementById('msgs');
  let html='',lastDate=null;
  msgs.forEach(m=>{
    const d=fmtDate(m.created_at);
    if(d!==lastDate){html+=`<div class="day-div"><span>${d}</span></div>`;lastDate=d;}
    const own=m.sender_id===me.id;
    const av=m.sender_avatar_url?`<img src="${m.sender_avatar_url}"/>`:(m.sender_avatar||'👤');
    const msgContent=renderMsgContent(m);
    const isImg=msgContent.startsWith('__IMG__');
    const isAudio=m.text.startsWith('[audio]');

    // Reply preview
    let replyHtml='';
    if(m.reply_to){
      const orig=msgs.find(x=>x.id===m.reply_to);
      if(orig){
        const origPreview=orig.text.startsWith('[img]')?'📷 Фото':orig.text.startsWith('[audio]')?'🎤 Голосовое':orig.text.slice(0,60);
        replyHtml=`<div class="reply-preview"><div class="reply-preview-name">${esc(orig.sender_name)}</div><div class="reply-preview-text">${esc(origPreview)}</div></div>`;
      }
    }

    // Reactions
    const msgReacts=reactions[m.id]||[];
    const reactMap={};
    for(const r of msgReacts){if(!reactMap[r.emoji])reactMap[r.emoji]=[];reactMap[r.emoji].push(r.user_id);}
    const reactHtml=Object.keys(reactMap).length
      ?`<div class="msg-reactions">${Object.entries(reactMap).map(([e,users])=>{
          const mine=users.includes(me.id);
          return `<span class="reaction-chip${mine?' mine':''}" onclick="toggleReaction('${m.id}','${e}')">${e}<span class="reaction-count">${users.length}</span></span>`;
        }).join('')}</div>`:'';

    const editedLabel=m.edited?`<span class="msg-edited">ред.</span>`:'';
    const menuAttr=`oncontextmenu="showMsgMenu(event,'${m.id}',${own})" onlongpress="showMsgMenu(event,'${m.id}',${own})"`;

    if(isImg){
      const url=msgContent.slice(7,-7);
      html+=`<div class="msg-row${own?' own':''}" data-id="${m.id}" ${menuAttr}>
        ${!own?`<div class="msg-sav">${avHtml(av)}</div>`:''}
        <div class="bubble" style="padding:4px;overflow:hidden;line-height:0">
          ${replyHtml}
          ${activeChat?.type==='group'&&!own?`<div style="padding:4px 8px 4px;font-size:11px;font-weight:700;color:var(--accent2);line-height:1.4">${esc(m.sender_name)}</div>`:''}
          <img class="msg-img" src="${url}" onclick="window.open('${url}','_blank')"/>
          <div class="msg-time" style="line-height:1;padding:2px 6px 2px">${fmtTime(m.created_at)}${editedLabel}</div>
        </div>
        ${reactHtml?`<div style="${own?'order:-1;margin-right:4px':'margin-left:4px'}">${reactHtml}</div>`:''}
      </div>`;
    } else {
      html+=`<div class="msg-row${own?' own':''}" data-id="${m.id}" ${menuAttr}>
        ${!own?`<div class="msg-sav">${avHtml(av)}</div>`:''}
        <div>
          <div class="bubble">
            ${replyHtml}
            ${activeChat?.type==='group'&&!own?`<div class="msg-sname">${esc(m.sender_name)}</div>`:''}
            <div class="msg-text">${msgContent}</div>
            <div class="msg-time">${fmtTime(m.created_at)}${editedLabel}</div>
          </div>
          ${reactHtml}
        </div>
      </div>`;
    }
  });
  container.innerHTML=html;

  // Long press support for mobile
  container.querySelectorAll('.msg-row[data-id]').forEach(el=>{
    let t;
    el.addEventListener('touchstart',e=>{t=setTimeout(()=>showMsgMenu(e,el.dataset.id,el.classList.contains('own')),600);},{passive:true});
    el.addEventListener('touchend',()=>clearTimeout(t),{passive:true});
    el.addEventListener('touchmove',()=>clearTimeout(t),{passive:true});
  });
}
function scrollBottom(){const c=document.getElementById('msgs');c.scrollTop=c.scrollHeight;}
function fmtDate(ts){
  const d=new Date(ts),t=new Date();
  if(d.toDateString()===t.toDateString()) return 'Сегодня';
  const y=new Date(t);y.setDate(y.getDate()-1);
  if(d.toDateString()===y.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru',{day:'numeric',month:'short'});
}

// ── SEND ──────────────────────────────────────────────
async function sendMsg(){
  const inp=document.getElementById('msg-input');
  const text=inp.value.trim();
  if(!text||!activeChat) return;
  inp.value='';inp.style.height='auto';
  document.getElementById('send-btn').disabled=true;
  try{
    if(editingMsgId){
      // Edit mode
      const {error}=await sb.from('messages').update({text,edited:true}).eq('id',editingMsgId).eq('sender_id',me.id);
      if(error) throw error;
      const idx=msgs.findIndex(m=>m.id===editingMsgId);
      if(idx>=0){msgs[idx].text=text;msgs[idx].edited=true;renderMsgs();}
      cancelEdit();
    } else {
      await sendRawMsg(text,replyTo?.id||null);
      cancelReply();
    }
  } catch(e){inp.value=text;alert(e.message);}
  finally{document.getElementById('send-btn').disabled=false;}
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}

// ── REPLY ─────────────────────────────────────────────
function startReply(msgId){
  const m=msgs.find(x=>x.id===msgId);if(!m) return;
  cancelEdit();
  replyTo=m;
  const bar=document.getElementById('reply-bar');
  document.getElementById('reply-bar-name').textContent=m.sender_name;
  const prev=m.text.startsWith('[img]')?'📷 Фото':m.text.startsWith('[audio]')?'🎤 Голосовое':m.text.slice(0,60);
  document.getElementById('reply-bar-msg').textContent=prev;
  bar.classList.add('active');
  document.getElementById('msg-input').focus();
  closeContextMenu();
}
function cancelReply(){replyTo=null;document.getElementById('reply-bar').classList.remove('active');}

// ── EDIT ──────────────────────────────────────────────
function startEdit(msgId){
  const m=msgs.find(x=>x.id===msgId);if(!m||m.sender_id!==me.id) return;
  cancelReply();
  editingMsgId=msgId;
  const bar=document.getElementById('edit-bar');bar.classList.add('active');
  const inp=document.getElementById('msg-input');inp.value=m.text;inp.focus();autoResize(inp);
  closeContextMenu();
}
function cancelEdit(){
  editingMsgId=null;
  document.getElementById('edit-bar').classList.remove('active');
  document.getElementById('msg-input').value='';
}

// ── DELETE ────────────────────────────────────────────
async function deleteMsg(msgId){
  if(!confirm('Удалить сообщение?')) return;
  const {error}=await sb.from('messages').delete().eq('id',msgId).eq('sender_id',me.id);
  if(error){alert(error.message);return;}
  msgs=msgs.filter(m=>m.id!==msgId);renderMsgs();
  closeContextMenu();
}

// ── CONTEXT MENU ──────────────────────────────────────
let activeMenu=null;
function showMsgMenu(e,msgId,own){
  e.preventDefault();closeContextMenu();
  const menu=document.createElement('div');menu.className='msg-menu';menu.id='msg-ctx-menu';
  const items=[
    {icon:'↩️',label:'Ответить',fn:`startReply('${msgId}')`},
    {icon:'😄',label:'Реакция',fn:`showEmojiPicker(event,'${msgId}')`},
    ...(own?[
      {icon:'✏️',label:'Редактировать',fn:`startEdit('${msgId}')`},
      {icon:'🗑️',label:'Удалить',fn:`deleteMsg('${msgId}')`,danger:true}
    ]:[])
  ];
  menu.innerHTML=items.map(i=>`<div class="msg-menu-item${i.danger?' danger':''}" onclick="${i.fn}">${i.icon} ${i.label}</div>`).join('');

  const x=Math.min(e.clientX||e.touches?.[0]?.clientX||100, window.innerWidth-175);
  const y=Math.min(e.clientY||e.touches?.[0]?.clientY||100, window.innerHeight-160);
  menu.style.left=x+'px';menu.style.top=y+'px';menu.style.position='fixed';
  document.body.appendChild(menu);activeMenu=menu;
  setTimeout(()=>document.addEventListener('click',closeContextMenu,{once:true}),50);
}
function closeContextMenu(){if(activeMenu){activeMenu.remove();activeMenu=null;}}

// ── EMOJI PICKER ──────────────────────────────────────
const REACTION_EMOJIS=['👍','❤️','😂','😮','😢','🔥','👏','🎉'];
function showEmojiPicker(e,msgId){
  e.stopPropagation();closeContextMenu();
  const picker=document.createElement('div');picker.className='emoji-picker';picker.id='emoji-picker';
  picker.innerHTML=REACTION_EMOJIS.map(em=>`<span onclick="toggleReaction('${msgId}','${em}');closeEmojiPicker()">${em}</span>`).join('');
  const x=Math.min(e.clientX||100, window.innerWidth-240);
  const y=(e.clientY||100)-60;
  picker.style.left=x+'px';picker.style.top=y+'px';picker.style.position='fixed';
  document.body.appendChild(picker);
  setTimeout(()=>document.addEventListener('click',closeEmojiPicker,{once:true}),50);
}
function closeEmojiPicker(){const p=document.getElementById('emoji-picker');if(p)p.remove();}

// ── REACTIONS ────────────────────────────────────────
async function toggleReaction(msgId,emoji){
  const existing=(reactions[msgId]||[]).find(r=>r.user_id===me.id&&r.emoji===emoji);
  if(existing){
    await sb.from('reactions').delete().eq('message_id',msgId).eq('user_id',me.id).eq('emoji',emoji);
    if(reactions[msgId]) reactions[msgId]=reactions[msgId].filter(r=>!(r.user_id===me.id&&r.emoji===emoji));
  } else {
    const {data,error}=await sb.from('reactions').insert({message_id:msgId,user_id:me.id,emoji}).select().single();
    if(!error&&data){if(!reactions[msgId])reactions[msgId]=[];reactions[msgId].push(data);}
  }
  renderMsgs();
}

// ── NEW GROUP ─────────────────────────────────────────
let groupSel=[],groupAv='👥';
function openNewGroup(){
  groupSel=[];groupAv='👥';
  showModal(`<div class="modal" onclick="event.stopPropagation()">
    <h2>👥 Создать группу</h2>
    <div class="field"><label>Название</label><input id="g-name" placeholder="Название группы..."/></div>
    <div class="field"><label>Иконка</label>
      <div class="av-grid">${GROUP_AVS.map(a=>`<div class="av-opt${a===groupAv?' on':''}" onclick="pickGav('${a}')">${a}</div>`).join('')}</div>

}
function pickGav(a){groupAv=a;document.querySelectorAll('#modal-root .av-opt').forEach(el=>el.classList.toggle('on',el.textContent===a));}
function renderGList(){
  const q=(document.getElementById('g-search')?.value||'').toLowerCase();
  const list=document.getElementById('g-ulist');const cnt=document.getElementById('g-cnt');
  if(!list) return;if(cnt) cnt.textContent=groupSel.length?`(${groupSel.length})`:'';
  list.innerHTML=allUsers.filter(u=>u.name.toLowerCase().includes(q)||u.username.includes(q)).map(u=>{
    const sel=groupSel.includes(u.id);
    return `<div class="ui${sel?' on':''}" onclick="toggleGSel('${u.id}')">
      <div class="ui-av">${avHtml(u.avatar_url?`<img src="${u.avatar_url}"/>`:u.avatar)}</div>
      <div><div class="ui-name">${esc(u.name)}</div><div class="ui-un">@${esc(u.username)}</div></div>
      ${sel?'<span class="check">✓</span>':''}
    </div>`;
  }).join('');
}
function toggleGSel(id){groupSel=groupSel.includes(id)?groupSel.filter(x=>x!==id):[...groupSel,id];renderGList();}
async function createGroup(){
  const name=document.getElementById('g-name')?.value.trim();
  if(!name){alert('Введи название');return;}
  if(!groupSel.length){alert('Добавь хотя бы одного участника');return;}
  const {data:chat}=await sb.from('chats').insert({type:'group',name,avatar:groupAv,created_by:me.id}).select().single();
  await sb.from('chat_members').insert([me.id,...groupSel.filter(x=>x!==me.id)].map(uid=>({chat_id:chat.id,user_id:uid})));
  await loadAll();closeModal();openChat(chat.id);
}

      <input type="file" id="av-file" accept="image/*" style="display:none" onchange="uploadAvatar(this)"/>

      <div class="av-grid">${AVATARS.map(a=>`<div class="av-opt${a===me.avatar?' on':''}" onclick="pickProfAv('${a}')" id="pav-${a}">${a}</div>`).join('')}</div>
    </div>

function pickProfAv(a){

  const p=document.getElementById('prof-av-preview');p.innerHTML=a;p.style.fontSize='44px';

async function uploadAvatar(input){
  const file=input.files[0];if(!file) return;
  try{
    const path=`${me.id}/${Date.now()}.${file.name.split('.').pop()}`;
    const {error:ue}=await sb.storage.from('avatars').upload(path,file,{upsert:true});
    if(ue) throw ue;
    const {data:{publicUrl}}=sb.storage.from('avatars').getPublicUrl(path);
    await sb.from('profiles').update({avatar_url:publicUrl}).eq('id',me.id);
    me.avatar_url=publicUrl;localStorage.setItem('bc_me',JSON.stringify(me));renderMe();
    const p=document.getElementById('prof-av-preview');
    p.innerHTML=`<img src="${publicUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:18px"/>`;
  } catch(e){alert('Ошибка загрузки: '+e.message);}
}
async function saveProfile(){
  const name=document.getElementById('prof-name')?.value.trim();if(!name) return;
  await sb.from('profiles').update({name,avatar:tmpAv||me.avatar}).eq('id',me.id);
  me.name=name;me.avatar=tmpAv||me.avatar;
  localStorage.setItem('bc_me',JSON.stringify(me));renderMe();closeModal();
}


// ── SEND PHOTO ────────────────────────────────────────
async function sendPhoto(input){
  const file=input.files[0];if(!file||!activeChat) return;
  input.value='';
  try{
    const path=`chats/${activeChat.id}/${Date.now()}_${file.name}`;
    const {error:ue}=await sb.storage.from('media').upload(path,file,{upsert:true});
    if(ue) throw ue;
    const {data:{publicUrl}}=sb.storage.from('media').getPublicUrl(path);
    await sendRawMsg('[img]'+publicUrl+'[/img]');
  } catch(e){alert('Ошибка загрузки фото: '+e.message);}

// ── AUDIO RECORDING ───────────────────────────────────
let mediaRecorder=null, audioChunks=[], isRecording=false;

async function toggleRecording(){
  const btn=document.getElementById('rec-btn');
  if(!isRecording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream);
      audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=async()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        stream.getTracks().forEach(t=>t.stop());
        try{
          const path=`chats/${activeChat.id}/audio_${Date.now()}.webm`;
          const {error:ue}=await sb.storage.from('media').upload(path,blob,{upsert:true,contentType:'audio/webm'});
          if(ue) throw ue;
          const {data:{publicUrl}}=sb.storage.from('media').getPublicUrl(path);
          await sendRawMsg('[audio]'+publicUrl+'[/audio]');
        } catch(e){alert('Ошибка загрузки аудио: '+e.message);}
      };
      mediaRecorder.start();
      isRecording=true;
      btn.classList.add('recording');
      btn.textContent='⏹';
    } catch(e){alert('Нет доступа к микрофону: '+e.message);}
  } else {
    mediaRecorder.stop();
    isRecording=false;
    btn.classList.remove('recording');
    btn.textContent='🎤';
  }
}

// ── SEND RAW MESSAGE (text/img/audio) ─────────────────
async function sendRawMsg(text, replyToId=null){
  const {data,error}=await sb.from('messages')
    .insert({chat_id:activeChat.id,sender_id:me.id,text,reply_to:replyToId||null})
    .select('id,chat_id,text,created_at,reply_to').single();
  if(error) throw error;
  const enriched={...data,created_at:+new Date(data.created_at),sender_id:me.id,
    reply_to:data.reply_to||null,edited:false,
    sender_name:me.name,sender_avatar:me.avatar,sender_avatar_url:me.avatar_url,sender_username:me.username};
  if(!msgs.find(m=>m.id===enriched.id)){msgs.push(enriched);renderMsgs();scrollBottom();}
  const chat=chats.find(c=>c.id===activeChat.id);
  if(chat){chat.last_text=text.startsWith('[img]')?'📷 Фото':text.startsWith('[audio]')?'🎤 Голосовое':text;
    chat.last_at=enriched.created_at;chat.last_sender=me.id;}
  chats.sort((a,b)=>(b.last_at||+new Date(b.created_at))-(a.last_at||+new Date(a.created_at)));
  renderChats();
}

// ── RENDER MESSAGE CONTENT ────────────────────────────
function renderMsgContent(m){
  const t=m.text||'';
  if(t.startsWith('[img]')&&t.endsWith('[/img]')){
    const url=t.slice(5,-6);
    return `__IMG__${url}__IMG__`;
  }
  if(t.startsWith('[audio]')&&t.endsWith('[/audio]')){
    const url=t.slice(7,-8);
    return `<audio class="msg-audio" controls src="${url}"></audio>`;
  }
  return esc(t).replace(/\n/g,'<br>');
}

// ── MODALS + UTILS ────────────────────────────────────
function showModal(html){document.getElementById('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">${html}</div>`;}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function showNotif(title,text){

  document.body.appendChild(n);setTimeout(()=>n.remove(),4000);
}
function closeMobileChat(){
  document.getElementById('sidebar').classList.add('mob-open');activeChat=null;
  document.getElementById('chat-view').style.display='none';
  document.getElementById('empty-chat').style.display='flex';renderChats();
}
function avHtml(av){return typeof av==='string'&&av.startsWith('<')?av:`<span>${av}</span>`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── VISUAL VIEWPORT FIX (Yandex Browser / Android Chrome) ──
// Подтягивает приложение вверх когда браузерная панель видна
(function(){
  function applyViewport(){
    const vv = window.visualViewport;
    if(!vv) return;
    const app = document.getElementById('app');
    const auth = document.getElementById('auth');
    const h = vv.height;
    // Сдвигаем весь экран чтобы input-bar был виден над панелью браузера
    document.documentElement.style.setProperty('--vh', h + 'px');
    if(app) { app.style.height = h + 'px'; app.style.maxHeight = h + 'px'; }
    if(auth) { auth.style.height = h + 'px'; }
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', applyViewport);
    window.visualViewport.addEventListener('scroll', applyViewport);
  }
  window.addEventListener('resize', applyViewport);
  applyViewport();
})();
